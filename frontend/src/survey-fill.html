<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客户满意度调查 - 昆山飘得华电子材料有限公司</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* 问卷填写页面独立样式 - 覆盖主CSS的overflow:hidden */
        html, body {
            overflow-y: auto !important;
            height: auto !important;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 0;
        }

        .survey-container {
            max-width: 700px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .survey-header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .survey-header .logo-icon {
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.2);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            font-size: 28px;
            color: white;
        }

        .survey-header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .survey-header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .survey-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .survey-card-header {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            padding: 30px;
        }

        .survey-card-header h2 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .survey-card-header p {
            opacity: 0.9;
            line-height: 1.7;
            font-size: 14px;
        }

        .survey-progress {
            background: #f3f4f6;
            height: 4px;
            position: relative;
        }

        .survey-progress-bar {
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            height: 100%;
            transition: width 0.3s ease;
            width: 0%;
        }

        .survey-body {
            padding: 30px;
        }

        .question-block {
            margin-bottom: 30px;
            padding-bottom: 25px;
            border-bottom: 1px solid #f0f0f0;
        }

        .question-block:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .question-title {
            font-size: 16px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .question-title .required {
            color: #ef4444;
            margin-left: 4px;
        }

        .question-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            background: #4f46e5;
            color: white;
            border-radius: 50%;
            font-size: 12px;
            font-weight: 600;
            margin-right: 10px;
        }

        .rating-stars {
            display: flex;
            gap: 8px;
        }

        .rating-star {
            font-size: 36px;
            color: #d1d5db;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .rating-star:hover,
        .rating-star.active {
            color: #fbbf24;
            transform: scale(1.1);
        }

        .rating-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 12px;
            color: #9ca3af;
            padding: 0 4px;
        }

        .option-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-item {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-item:hover {
            border-color: #c7d2fe;
            background: #f5f3ff;
        }

        .option-item.selected {
            border-color: #4f46e5;
            background: #eef2ff;
        }

        .option-item input[type="radio"],
        .option-item input[type="checkbox"] {
            display: none;
        }

        .option-radio {
            width: 20px;
            height: 20px;
            border: 2px solid #d1d5db;
            border-radius: 50%;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .option-item.selected .option-radio {
            border-color: #4f46e5;
        }

        .option-item.selected .option-radio::after {
            content: '';
            width: 10px;
            height: 10px;
            background: #4f46e5;
            border-radius: 50%;
        }

        .option-check {
            width: 20px;
            height: 20px;
            border: 2px solid #d1d5db;
            border-radius: 6px;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .option-item.selected .option-check {
            border-color: #4f46e5;
            background: #4f46e5;
        }

        .option-item.selected .option-check::after {
            content: '✓';
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        .option-text {
            font-size: 14px;
            color: #374151;
        }

        .text-input {
            width: 100%;
            min-height: 120px;
            padding: 14px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.2s ease;
            box-sizing: border-box;
        }

        .text-input:focus {
            outline: none;
            border-color: #4f46e5;
        }

        .survey-footer {
            padding: 20px 30px 30px;
            background: #f9fafb;
            border-top: 1px solid #f0f0f0;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
        }

        .thank-you-page {
            text-align: center;
            padding: 60px 30px;
        }

        .thank-you-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
            margin-bottom: 24px;
            animation: scaleIn 0.5s ease;
        }

        @keyframes scaleIn {
            0% { transform: scale(0); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .thank-you-page h2 {
            font-size: 24px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 12px;
        }

        .thank-you-page p {
            color: #6b7280;
            line-height: 1.7;
        }

        .error-page {
            text-align: center;
            padding: 60px 30px;
        }

        .error-icon {
            width: 80px;
            height: 80px;
            background: #fef2f2;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #ef4444;
            margin-bottom: 24px;
        }

        .error-page h2 {
            font-size: 20px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 10px;
        }

        .error-page p {
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="survey-container">
        <div class="survey-header">
            <div class="logo-icon">
                <i class="fa-solid fa-layer-group"></i>
            </div>
            <h1>昆山飘得华电子材料有限公司</h1>
            <p>您的反馈是我们进步的动力</p>
        </div>

        <div class="survey-card" id="surveyCard">
            <div id="surveyContent">
                <!-- 问卷内容将通过JS渲染 -->
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="js/survey.js"></script>
    <script src="js/survey-fill.js"></script>
</body>
</html>
